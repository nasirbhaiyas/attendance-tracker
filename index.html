<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketFlow - Nasir</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Ultra-Lightweight HTM (~600B replaces ~2.5MB Babel Standalone) -->
  <script crossorigin src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Elegant Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    /* Neon Glowing Input Effect */
    @keyframes neon-pulse {
      0%, 100% {
        box-shadow: 0 0 8px rgba(59, 130, 246, 0.6), 0 0 15px rgba(59, 130, 246, 0.3), inset 0 0 8px rgba(59, 130, 246, 0.2);
        border-color: rgba(96, 165, 250, 0.8);
      }
      50% {
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.9), 0 0 25px rgba(59, 130, 246, 0.6), inset 0 0 12px rgba(59, 130, 246, 0.4);
        border-color: rgba(147, 197, 253, 1);
      }
    }
    .neon-glow {
      animation: neon-pulse 2s infinite alternate;
      border-style: solid !important;
      will-change: box-shadow;
    }
    .neon-glow:focus {
      animation: none;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.9), 0 0 30px rgba(34, 211, 238, 0.6), inset 0 0 15px rgba(34, 211, 238, 0.5);
      border-color: rgba(34, 211, 238, 1) !important;
    }

    /* Fixed Half-Pink Wavy Top & White Bottom Background */
    #root { position: relative; z-index: 1; }
    .fixed-wave-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background-color: #ffffff;
    }
    .dark .fixed-wave-bg {
      background-color: #020617;
    }
    .pink-wave-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 46vh;
      background: linear-gradient(180deg, #f472b6 0%, #f9a8d4 70%, #fbcfe8 100%);
    }
    .dark .pink-wave-top {
      background: linear-gradient(180deg, #831843 0%, #500724 75%, #3b0724 100%);
    }
    .pink-wave-seam {
      position: absolute;
      top: calc(46vh - 2px);
      left: 0;
      width: 100%;
      height: 110px;
      overflow: hidden;
      line-height: 0;
    }
    .pink-wave-seam svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">
  <!-- Fixed Static Wavy Pink Top & White Bottom Background -->
  <div class="fixed-wave-bg" aria-hidden="true">
    <div class="pink-wave-top"></div>
    <div class="pink-wave-seam">
      <!-- Static Soft Back Pink Wave -->
      <svg class="text-pink-300 dark:text-pink-900 fill-current opacity-45" viewBox="0 0 1200 120" preserveAspectRatio="none">
        <path d="M0,0 L1200,0 L1200,52 C1050,115 900,10 600,62 C300,114 150,12 0,52 Z"></path>
      </svg>
      <!-- Static Front Main Pink Wave -->
      <svg class="text-pink-200 dark:text-[#3b0724] fill-current" viewBox="0 0 1200 120" preserveAspectRatio="none">
        <path d="M0,0 L1200,0 L1200,38 C1020,105 840,5 600,54 C360,103 180,8 0,38 Z"></path>
      </svg>
    </div>
  </div>
  <div id="root"></div>

  <script>
    const html = htm.bind(React.createElement);
    const { useState, useMemo, useEffect, useRef, useCallback, memo } = React;

    // --- Zero-CDN Memoized Inline SVG Icons (Replaces ~600KB Lucide CDN + DOM thrashing) ---
    const ICON_PATHS = {
      Check: '<path d="M20 6 9 17l-5-5"/>',
      AlertCircle: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
      X: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
      Minimize2: '<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" x2="21" y1="10" y2="3"/><line x1="3" x2="10" y1="21" y2="14"/>',
      Maximize2: '<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/>',
      Undo2: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 5.5 5.5 0 0 1-5.5 5.5H11"/>',
      CheckCircle: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>',
      Clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
      ClipboardPaste: '<path d="M15 2H9a1 1 0 0 0-1 1v2c0 .6.4 1 1 1h6c.6 0 1-.4 1-1V3c0-.6-.4-1-1-1Z"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2M16 4h2a2 2 0 0 1 2 2v2M11 14h10"/><path d="m17 10 4 4-4 4"/>',
      Activity: '<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>',
      Sparkles: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/>',
      Gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
      Flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
      Award: '<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>',
      Calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
      Target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
      Edit3: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
      BarChart2: '<line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/>',
      GripVertical: '<circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/>',
      Copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
      FileText: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
      Search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
      Star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
      AlignJustify: '<line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/>',
      List: '<line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/>',
      Download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
      Trash2: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
      CheckSquare: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/>',
      Square: '<rect width="18" height="18" x="3" y="3" rx="2"/>',
      RotateCcw: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
      Terminal: '<polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/>',
      Zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
      Rocket: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
      Database: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>',
      Upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
      BookOpen: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
      Plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
      LayoutDashboard: '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
      KanbanSquare: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 7v7"/><path d="M12 7v4"/><path d="M16 7v9"/>',
      Menu: '<line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>',
      Settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
      Volume2: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
      VolumeX: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/>',
      Moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
      Sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
      Layers: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
      Lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'
    };

    const Icon = memo(({ name, className = "", onClick, title, style }) => {
      const markup = ICON_PATHS[name] || '';
      return html`
        <span
          onClick=${onClick}
          style=${style}
          title=${title}
          className=${`inline-flex shrink-0 justify-center items-center ${onClick ? 'cursor-pointer' : ''}`}
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
            className=${className}
            dangerouslySetInnerHTML=${{ __html: markup }}
          />
        </span>
      `;
    });

    // --- Lightweight Native Bar Chart (Replaces ~450KB Recharts + PropTypes) ---
    const LiteBarChart = memo(({ data, xKey = 'name', yKey = 'count', seriesLabel = 'Tickets', defaultColor = '#3b82f6', maxBarWidth = 52, onBarClick }) => {
      const [hoveredIdx, setHoveredIdx] = useState(null);
      const maxVal = Math.max(1, ...data.map(d => Number(d[yKey]) || 0));
      const step = maxVal <= 4 ? 1 : Math.ceil(maxVal / 4);
      const yMax = step * 4;
      const ticks = [yMax, step * 3, step * 2, step, 0];

      return html`
        <div className="w-full h-full flex flex-col select-none relative">
          <div className="flex-1 flex items-stretch gap-2 min-h-0 pt-2">
            <div className="flex flex-col justify-between text-[11px] text-slate-400 dark:text-slate-400 text-right pr-1 pb-6 w-7 shrink-0">
              ${ticks.map((t, i) => html`<span key=${i} className="leading-none">${t}</span>`)}
            </div>
            <div className="flex-1 relative flex flex-col min-w-0">
              <div className="flex-1 relative flex items-end justify-around gap-1.5 border-b border-slate-200 dark:border-slate-700/80 px-1">
                <div className="absolute inset-0 flex flex-col justify-between pointer-events-none">
                  ${[0, 1, 2, 3].map(i => html`
                    <div key=${i} className="w-full border-t border-dashed border-slate-200 dark:border-slate-700/70" />
                  `)}
                  <div />
                </div>
                ${data.map((entry, idx) => {
                  const val = Number(entry[yKey]) || 0;
                  const pct = Math.max(val > 0 ? 4 : 0, (val / yMax) * 100);
                  const barColor = entry.color || defaultColor;
                  const isHovered = hoveredIdx === idx;
                  return html`
                    <div
                      key=${`${entry[xKey]}-${idx}`}
                      className="flex-1 h-full flex flex-col items-center justify-end relative z-10 group"
                      onMouseEnter=${() => setHoveredIdx(idx)}
                      onMouseLeave=${() => setHoveredIdx(null)}
                      onClick=${() => onBarClick && onBarClick(entry[xKey])}
                      title=${onBarClick ? `Click to filter "${entry[xKey]}" in Full Report` : undefined}
                    >
                      ${isHovered && html`
                        <div className="absolute bottom-full mb-1.5 z-30 px-2.5 py-1.5 rounded-xl bg-white dark:bg-slate-800 text-slate-800 dark:text-white shadow-lg border border-slate-200 dark:border-slate-700 text-[11px] whitespace-nowrap pointer-events-none">
                          <div className="font-bold">${entry[xKey]}</div>
                          <div className="text-slate-500 dark:text-slate-300">${seriesLabel}: <strong style=${{ color: barColor }}>${val}</strong></div>
                        </div>
                      `}
                      <div
                        className="w-full rounded-t-md transition-all duration-300 cursor-pointer"
                        style=${{
                          height: `${pct}%`,
                          maxWidth: `${maxBarWidth}px`,
                          backgroundColor: barColor,
                          opacity: hoveredIdx === null || isHovered ? 1 : 0.65,
                          transform: isHovered ? 'scaleY(1.02)' : 'scaleY(1)',
                          transformOrigin: 'bottom'
                        }}
                      />
                    </div>
                  `;
                })}
              </div>
              <div className="flex items-start justify-around gap-1.5 pt-2 h-6 px-1">
                ${data.map((entry, idx) => html`
                  <span key=${`${entry[xKey]}-lbl-${idx}`} title=${entry[xKey]} className="flex-1 text-center text-[11px] text-slate-500 dark:text-slate-400 truncate">
                    ${entry[xKey]}
                  </span>
                `)}
              </div>
            </div>
          </div>
        </div>
      `;
    });

    // --- Lightweight Native Donut Chart ---
    const LiteDonutChart = memo(({ data }) => {
      const [hoveredIdx, setHoveredIdx] = useState(null);
      const total = data.reduce((sum, d) => sum + (Number(d.count) || 0), 0);
      const radius = 66;
      const strokeWidth = 28;
      const circumference = 2 * Math.PI * radius;
      let cumulative = 0;

      const hoveredItem = hoveredIdx !== null ? data[hoveredIdx] : null;

      return html`
        <div className="w-full h-full flex flex-col items-center justify-between select-none">
          <div className="relative flex-1 w-full flex items-center justify-center min-h-[190px]">
            <svg viewBox="0 0 180 180" className="w-44 h-44 -rotate-90 overflow-visible">
              ${data.map((entry, idx) => {
                const val = Number(entry.count) || 0;
                const ratio = total > 0 ? val / total : 0;
                const gap = data.length > 1 ? 3 : 0;
                const dashLen = Math.max(0, ratio * circumference - gap);
                const dashOffset = -(cumulative * circumference);
                cumulative += ratio;
                const isHovered = hoveredIdx === idx;
                return html`
                  <circle
                    key=${`${entry.name}-${idx}`}
                    cx="90"
                    cy="90"
                    r=${radius}
                    fill="transparent"
                    stroke=${entry.color}
                    strokeWidth=${isHovered ? strokeWidth + 4 : strokeWidth}
                    strokeDasharray=${`${dashLen} ${circumference}`}
                    strokeDashoffset=${dashOffset}
                    className="transition-all duration-200 cursor-pointer"
                    style=${{ opacity: hoveredIdx === null || isHovered ? 1 : 0.6 }}
                    onMouseEnter=${() => setHoveredIdx(idx)}
                    onMouseLeave=${() => setHoveredIdx(null)}
                  />
                `;
              })}
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center px-3">
              ${hoveredItem ? html`
                <span className="text-lg font-extrabold text-slate-800 dark:text-white leading-tight">${hoveredItem.count}</span>
                <span className="text-[10px] font-semibold text-slate-500 dark:text-slate-300 truncate max-w-[90px]">${hoveredItem.name}</span>
              ` : html`
                <span className="text-lg font-extrabold text-slate-800 dark:text-white leading-tight">${total}</span>
                <span className="text-[10px] font-medium text-slate-400">Total</span>
              `}
            </div>
          </div>
          <div className="flex flex-wrap items-center justify-center gap-x-3 gap-y-1 pt-1">
            ${data.map((entry, idx) => html`
              <div
                key=${`leg-${entry.name}-${idx}`}
                onMouseEnter=${() => setHoveredIdx(idx)}
                onMouseLeave=${() => setHoveredIdx(null)}
                className="inline-flex items-center gap-1.5 text-[11px] text-slate-600 dark:text-slate-300 cursor-pointer"
              >
                <span className="w-2.5 h-2.5 rounded-full shrink-0" style=${{ backgroundColor: entry.color }} />
                <span>${entry.name}</span>
              </div>
            `)}
          </div>
        </div>
      `;
    });

    // --- Theme & Colors ---

    const COLOR_PALETTE_STYLES = [

    // --- Shared AudioContext for Zero-Latency Sound Feedback ---
    let sharedAudioCtx = null;
    const getAudioCtx = () => {
      if (!sharedAudioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) sharedAudioCtx = new AudioCtx();
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume().catch(() => {});
      }
      return sharedAudioCtx;
    };

    const playFeedbackTone = (type, enabled, pack = 'minimalist') => {
      if (!enabled) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (pack === 'arcade') {
          if (type === 'success') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.06);
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.22);
          } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.25);
          }
        } else if (pack === 'scifi') {
          if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.18);
          } else {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(420, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.22);
            gain.gain.setValueAtTime(0.14, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.24);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.24);
          }
        } else {
          if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(620, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(940, ctx.currentTime + 0.11);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.14);
          } else {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(240, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(170, ctx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.2);
          }
        }
      } catch {}
    };

    const prefixRegexCache = new WeakMap();
    const getCompiledPrefixRegexes = (customPrefixes) => {
      if (!Array.isArray(customPrefixes) || customPrefixes.length === 0) return [];
      let compiled = prefixRegexCache.get(customPrefixes);
      if (!compiled) {
        compiled = customPrefixes
          .map(p => (p || '').trim())
          .filter(Boolean)
          .map(p => new RegExp(`^${p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s*[:#-]?\\s*`, 'i'));
        prefixRegexCache.set(customPrefixes, compiled);
      }
      return compiled;
    };

    const cleanTicketText = (raw, customPrefixes = DEFAULT_PREFIX_RULES) => {
      if (!raw) return '';
      let cleaned = String(raw)
        .replace(/^F\s*Patient\s*Account\s*Number\s*[:#-]?\s*/i, '')
        .replace(/^Patient\s*Account\s*Number\s*[:#-]?\s*/i, '')
        .replace(/^Account\s*Number\s*[:#-]?\s*/i, '')
        .trim();

      const regexes = getCompiledPrefixRegexes(customPrefixes);
      for (let i = 0; i < regexes.length; i++) {
        cleaned = cleaned.replace(regexes[i], '').trim();
      }
      return cleaned;
    };

    const extractBulkTickets = (rawText, customPrefixes = DEFAULT_PREFIX_RULES) => {
      if (!rawText) return [];
      const lines = rawText.split(/[\r\n,;]+/);
      const tokens = [];
      lines.forEach((line) => {
        const cleanedLine = cleanTicketText(line, customPrefixes);
        if (!cleanedLine) return;
        const parts = cleanedLine.split(/\s+/).map(p => cleanTicketText(p, customPrefixes)).filter(Boolean);
        parts.forEach(p => tokens.push(p));
      });
      return Array.from(new Set(tokens));
    };

    const getTodayISO = () => {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };

    const getTicketISO = (t) => {
      if (t.isoDate) return t.isoDate;
      if (t.timestamp && t.timestamp.includes(' - ')) {
        const datePart = t.timestamp.split(' - ')[1];
        const parsed = new Date(datePart);
        if (!isNaN(parsed.getTime())) {
          const y = parsed.getFullYear();
          const m = String(parsed.getMonth() + 1).padStart(2, '0');
          const d = String(parsed.getDate()).padStart(2, '0');
          return `${y}-${m}-${d}`;
        }
      }
      return getTodayISO();
    };

    // --- Toast Notification Component ---
    const Toast = ({ message, type, onClose }) => {
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const enterTimer = setTimeout(() => setVisible(true), 10);
        const exitTimer = setTimeout(() => {
          setVisible(false);
          setTimeout(onClose, 300);
        }, 2600);
        return () => {
          clearTimeout(enterTimer);
          clearTimeout(exitTimer);
        };
      }, [message, onClose]);

      const bgColor = type === 'success' 
        ? 'bg-emerald-600/95 border-emerald-400 text-white shadow-emerald-500/25' 
        : 'bg-red-600/95 border-red-400 text-white shadow-red-500/25';
      const iconName = type === 'success' ? 'Check' : 'AlertCircle';

      return html`
        <div 
          className=${`fixed top-5 left-1/2 -translate-x-1/2 flex items-center px-5 py-3 border rounded-full shadow-2xl backdrop-blur-md ${bgColor} transition-all duration-300 ease-out z-[9999] ${
            visible ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 -translate-y-6 scale-95 pointer-events-none'
          }`}
        >
          <${Icon} name=${iconName} className="w-4 h-4 mr-2.5 shrink-0" />
          <span className="font-semibold text-sm tracking-wide whitespace-nowrap">${message}</span>
          <button 
            onClick=${() => { setVisible(false); setTimeout(onClose, 250); }} 
            className="ml-3 opacity-80 hover:opacity-100 transition-opacity"
          >
            <${Icon} name="X" className="w-4 h-4" />
          </button>
        </div>
      `;
    };

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState(null);
      const quickInputRef = useRef(null);
      const searchInputRef = useRef(null);
      const keyBuffer = useRef(''); 
      const [showUndoBtn, setShowUndoBtn] = useState(false);
      
      // --- Zen / Focus Mode ---
      const [zenMode, setZenMode] = useState(false);
      
      // --- Secret Master Tools Page ---
      const [showSecretPage, setShowSecretPage] = useState(false);
      
      // Multi-Note State
      const [secretNotes, setSecretNotes] = useState(() => {
        try {
          const saved = localStorage.getItem('taskTrackerSecretNotes');
          if (saved) return JSON.parse(saved);
          
          // Migration from old single string note
          const oldNote = localStorage.getItem('taskTrackerSecretNote');
          if (oldNote) {
            return [{ id: Date.now().toString(), title: 'Migrated Note', content: oldNote }];
          }
          return [{ id: Date.now().toString(), title: 'New Note', content: '' }];
        } catch { 
          return [{ id: Date.now().toString(), title: 'New Note', content: '' }]; 
        }
      });
      const [activeNoteId, setActiveNoteId] = useState(secretNotes[0]?.id || null);

      const [secretBulkInput, setSecretBulkInput] = useState('');
      const [secretBulkType, setSecretBulkType] = useState('Appeal');
      const [secretBulkCustomNote, setSecretBulkCustomNote] = useState('');
      const fileInputRef = useRef(null);

      // Debounced persistence for Secret Notes (prevents localStorage lag on every keystroke)
      useEffect(() => {
        const timer = setTimeout(() => {
          try { localStorage.setItem('taskTrackerSecretNotes', JSON.stringify(secretNotes)); } catch {}
        }, 400);
        return () => clearTimeout(timer);
      }, [secretNotes]);

      const updateActiveSecretNote = (field, value) => {
        setSecretNotes(prev => prev.map(note => 
          note.id === activeNoteId ? { ...note, [field]: value } : note
        ));
      };

      const handleCreateSecretNote = () => {
        const newNote = { id: Date.now().toString(), title: 'New Note', content: '' };
        setSecretNotes(prev => [newNote, ...prev]);
        setActiveNoteId(newNote.id);
      };

      const handleDeleteSecretNote = (id) => {
        const updated = secretNotes.filter(n => n.id !== id);
        setSecretNotes(updated.length > 0 ? updated : [{ id: Date.now().toString(), title: 'New Note', content: '' }]);
        if (activeNoteId === id) {
          setActiveNoteId(updated.length > 0 ? updated[0].id : null);
        }
      };

      const handleDownloadSecretNote = () => {
        const activeNote = secretNotes.find(n => n.id === activeNoteId);
        if (!activeNote || !activeNote.content.trim()) {
          setToast({ message: 'Note is empty, nothing to download.', type: 'error' });
          return;
        }
        const blob = new Blob([activeNote.content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        const safeTitle = (activeNote.title || 'Secret_Note').replace(/[^a-z0-9_-]/gi, '_');
        link.setAttribute('download', `${safeTitle}.txt`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setToast({ message: 'Note downloaded as TXT!', type: 'success' });

      // --- Compact / Relaxed Table View ---

      const [taskTypes, setTaskTypes] = useState(() => {

        } catch { return DEFAULT_TASK_TYPES; }

      const [showTypeManager, setShowTypeManager] = useState(false);
      const [newTypeName, setNewTypeName] = useState('');

      const [prefixRules, setPrefixRules] = useState(() => {

          const parsed = saved ? JSON.parse(saved) : null;
          return Array.isArray(parsed) ? parsed : DEFAULT_PREFIX_RULES;
        } catch { return DEFAULT_PREFIX_RULES; }
      });
      const [newPrefixRule, setNewPrefixRule] = useState('');

      useEffect(() => {
        try { localStorage.setItem('taskTrackerPrefixRules', JSON.stringify(prefixRules)); } catch {}
      }, [prefixRules]);

      useEffect(() => {
        try { localStorage.setItem('taskTrackerCustomTypes', JSON.stringify(taskTypes)); } catch {}
      }, [taskTypes]);

      const [dailyTarget, setDailyTarget] = useState(() => {
        try {
          const saved = parseInt(localStorage.getItem('taskTrackerDailyTarget'), 10);
          return !isNaN(saved) && saved > 0 ? saved : 50;
        } catch { return 50; }
      });
      const [weeklyTarget, setWeeklyTarget] = useState(() => {
        try {
          const saved = parseInt(localStorage.getItem('taskTrackerWeeklyTarget'), 10);
          return !isNaN(saved) && saved > 0 ? saved : 250;
        } catch { return 250; }
      });
      const [monthlyTarget, setMonthlyTarget] = useState(() => {
        try {
          const saved = parseInt(localStorage.getItem('taskTrackerMonthlyTarget'), 10);

      });

      const [isEditingTarget, setIsEditingTarget] = useState(false);
      const [targetDraft, setTargetDraft] = useState(String(dailyTarget));

      useEffect(() => {
        try { localStorage.setItem('taskTrackerDailyTarget', String(dailyTarget)); } catch {}
      }, [dailyTarget]);
      useEffect(() => {
        try { localStorage.setItem('taskTrackerWeeklyTarget', String(weeklyTarget)); } catch {}
      }, [weeklyTarget]);
      useEffect(() => {
        try { localStorage.setItem('taskTrackerMonthlyTarget', String(monthlyTarget)); } catch {}
      }, [monthlyTarget]);

      const [tickets, setTickets] = useState(() => {

        } catch { return []; }
      });

      const [trashedTickets, setTrashedTickets] = useState(() => {
        try {
          const saved = localStorage.getItem('taskTrackerTrash');

          const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;

      useEffect(() => {

          try { localStorage.setItem('taskTrackerTickets', JSON.stringify(tickets)); } catch (e) {}

      useEffect(() => {

      useEffect(() => {

      const [draggedTicket, setDraggedTicket] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');

      const [editingNoteDraft, setEditingNoteDraft] = useState('');

      const [bulkActionType, setBulkActionType] = useState('');
      const [bulkDeleteStep1, setBulkDeleteStep1] = useState(false);

      useEffect(() => {

      // O(1) Ticket Lookup Index for instant duplicate validation even with thousands of tickets
      const ticketIndex = useMemo(() => {
        const byLowerNo = new Map();
        const byDateAndNo = new Map();
        tickets.forEach(t => {
          const norm = cleanTicketText(t.ticketNo, prefixRules).replace(/\s+/g, ' ').trim().toLowerCase();
          if (!norm) return;
          if (!byLowerNo.has(norm)) byLowerNo.set(norm, t);
          const dateKey = `${getTicketISO(t)}|${norm}`;
          if (!byDateAndNo.has(dateKey)) byDateAndNo.set(dateKey, t);
        });
        return { byLowerNo, byDateAndNo };
      }, [tickets, prefixRules]);

      useEffect(() => {
        if (!confirmDeleteId) return;
        const timer = setTimeout(() => setConfirmDeleteId(null), 3000);
        return () => clearTimeout(timer);

        return () => clearTimeout(timer);

      // 1-Minute expiration window for Ctrl+Z bulk delete restore
      useEffect(() => {
        if (!lastDeletedBatch) return;
        const remaining = Math.max(0, 60000 - (Date.now() - lastDeletedBatch.deletedAt));
        const timer = setTimeout(() => setLastDeletedBatch(null), remaining);
        return () => clearTimeout(timer);

      useEffect(() => {
        if ((activeTab === 'dashboard' || zenMode) && !showQuickPopup && !showTypeManager && !duplicateConfirmData && !showSecretPage && !showRangePopup && !showBulkDeleteModal) {
          const timer = setTimeout(() => quickInputRef.current?.focus(), 60);
          return () => clearTimeout(timer);

      useEffect(() => {
