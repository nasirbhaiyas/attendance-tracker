          if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
            setShowDropdown(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      const validateTicketSubmission = useCallback((rawTicketNo) => {
        const cleaned = cleanTicketText(rawTicketNo, prefixRules);
        if (!cleaned) return { status: 'empty' };
        const normKey = cleaned.replace(/\s+/g, ' ').trim().toLowerCase();
        const targetISO = dashboardDate || getTodayISO();
        const sameDay = ticketIndex.byDateAndNo.get(`${targetISO}|${normKey}`);
        if (sameDay) return { status: 'same-day-duplicate', normalized: cleaned, existing: sameDay };
        const otherDay = ticketIndex.byLowerNo.get(normKey);
        if (otherDay) return { status: 'other-day-duplicate', normalized: cleaned, existing: otherDay };
        return { status: 'valid', normalized: cleaned };
      }, [ticketIndex, prefixRules, dashboardDate]);

      const aggregatedMetrics = useMemo(() => {
        const now = new Date();
        const startOfWeek = new Date(now);
        startOfWeek.setDate(now.getDate() - now.getDay());
        const weekISO = `${startOfWeek.getFullYear()}-${String(startOfWeek.getMonth() + 1).padStart(2, '0')}-${String(startOfWeek.getDate()).padStart(2, '0')}`;
        const monthPrefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        const targetDay = dashboardDate || getTodayISO();

        const countsByDay = {};
        const allTypeStats = {};
        const dashTypeStats = {};
        const dashTickets = [];
        let weekCount = 0;
        let monthCount = 0;

        tickets.forEach(t => {
          const iso = getTicketISO(t);
          countsByDay[iso] = (countsByDay[iso] || 0) + 1;
          if (iso >= weekISO) weekCount++;
          if (iso.startsWith(monthPrefix)) monthCount++;

          if (!allTypeStats[t.type]) allTypeStats[t.type] = { count: 0, time: 0 };
          allTypeStats[t.type].count += 1;
          allTypeStats[t.type].time += (t.timeSpent || 0);

          if (iso === targetDay) {
            dashTickets.push(t);
            if (!dashTypeStats[t.type]) dashTypeStats[t.type] = { count: 0, time: 0 };
            dashTypeStats[t.type].count += 1;
            dashTypeStats[t.type].time += (t.timeSpent || 0);
          }
        });

        return {
          countsByDay,
          weekCount,
          monthCount,
          dashboardTickets: dashTickets,
          statsByType: Object.keys(allTypeStats).map((key, index) => ({
            name: key, count: allTypeStats[key].count, time: allTypeStats[key].time, color: COLORS[index % COLORS.length]
          })),
          dashboardStatsByType: Object.keys(dashTypeStats).map((key, index) => ({
            name: key, count: dashTypeStats[key].count, time: dashTypeStats[key].time, color: COLORS[index % COLORS.length]
          }))
        };
      }, [tickets, dashboardDate]);

      const { statsByType, dashboardTickets, dashboardStatsByType, countsByDay } = aggregatedMetrics;
      const totalTickets = dashboardTickets.length;

      const commitTicketEntry = useCallback((ticketNo, type, note, isBulk = false, isFlagged = false) => {
        const newTicket = {
          id: Date.now() + Math.random().toString(36).substr(2, 9),
          ticketNo: cleanTicketText(ticketNo, prefixRules),
          type,
          status: 'Completed',
          timeSpent: 5,
          description: note || 'Fast Entry Log',
          timestamp: new Date().toLocaleString(),
          createdAtMs: Date.now(),
          entryTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          isoDate: dashboardDate || getTodayISO(),
          flagged: isFlagged
        };
        setTickets(prev => [newTicket, ...prev]);
        setDuplicateConfirmData(null);
        if (!isBulk) {
          setQuickTicketNo('');
          setQuickNote('');
          setShowQuickPopup(false);
          setQuickFlagged(false);
          playFeedbackTone('success', soundEnabled, soundPack);
          const nextCount = totalTickets + 1;
          if (dailyTarget > 0 && totalTickets < dailyTarget && nextCount >= dailyTarget) {
            setToast({ message: `🎉 100% Daily Target Achieved (${nextCount}/${dailyTarget})!`, type: 'success' });
          } else {
            setToast({ message: `Logged "${newTicket.ticketNo}" as ${type}`, type: 'success' });
          }
          setLastUsedType(type);
          try { localStorage.setItem('lastUsedTaskType', type); } catch {}
          setTimeout(() => { if (quickInputRef.current) quickInputRef.current.focus(); }, 100);
        }
      }, [prefixRules, dashboardDate, soundEnabled, soundPack, totalTickets, dailyTarget]);

      const handleQuickSave = useCallback((type) => {
        const check = validateTicketSubmission(quickTicketNo);
        if (check.status === 'empty') return;
        if (check.status === 'same-day-duplicate') {
          playFeedbackTone('error', soundEnabled, soundPack);
          setToast({ message: `Entry Denied! "${check.normalized}" already exists on ${dashboardDate || getTodayISO()} (${check.existing.type}).`, type: 'error' });
          return;
        }
        if (check.status === 'other-day-duplicate' && !duplicateConfirmData) {
          setDuplicateConfirmData({
            ticketNo: check.normalized,
            previousDate: getTicketISO(check.existing),
            previousType: check.existing.type,
            selectedType: type,
            note: quickNote,
            flagged: quickFlagged
          });
          return;
        }
        commitTicketEntry(quickTicketNo, type, quickNote, false, quickFlagged);
      }, [validateTicketSubmission, quickTicketNo, soundEnabled, soundPack, dashboardDate, duplicateConfirmData, quickNote, quickFlagged, commitTicketEntry]);

      const handleBulkSaveAll = useCallback((type) => {
        if (bulkTimerRef.current) {
          clearInterval(bulkTimerRef.current);
          setBulkCountdown(null);
        }

        let added = 0;
        const newEntries = [];
        const skipped = [];
        bulkQueue.forEach((tNo, idx) => {
          const check = validateTicketSubmission(tNo);
          if (check.status === 'same-day-duplicate') {
            skipped.push(check.normalized);
          } else {
            added++;
            newEntries.push({
              id: Date.now() + idx + Math.random().toString(36).substr(2, 9),
              ticketNo: check.normalized,
              type,
              status: 'Completed',
              timeSpent: 5,
              description: quickNote || 'Bulk Fast Entry',
              timestamp: new Date().toLocaleString(),
              createdAtMs: Date.now() + idx,
              entryTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
              isoDate: dashboardDate || getTodayISO(),
              flagged: quickFlagged
            });
          }
        });

        if (newEntries.length > 0) {
          setTickets(prev => [...newEntries, ...prev]);
          setLastUsedType(type);
          try { localStorage.setItem('lastUsedTaskType', type); } catch {}
        }

        const nextBulkCount = totalTickets + added;
        const hitTargetOnBulk = dailyTarget > 0 && totalTickets < dailyTarget && nextBulkCount >= dailyTarget;

        setQuickTicketNo('');
        setQuickNote('');
        setBulkQueue([]);
        setShowQuickPopup(false);
        setQuickFlagged(false);

        if (skipped.length > 0) {
          playFeedbackTone('error', soundEnabled, soundPack);
          setToast({ message: `Bulk Logged ${added}. Skipped ${skipped.length} duplicates.`, type: 'error' });
        } else if (hitTargetOnBulk) {
          playFeedbackTone('success', soundEnabled, soundPack);
          setToast({ message: `🎉 100% Daily Target Achieved (${nextBulkCount}/${dailyTarget})!`, type: 'success' });
        } else {
          playFeedbackTone('success', soundEnabled, soundPack);
          setToast({ message: `Successfully logged ${added} tickets as ${type}`, type: 'success' });
        }
        setTimeout(() => { if (quickInputRef.current) quickInputRef.current.focus(); }, 100);
      }, [bulkQueue, validateTicketSubmission, quickNote, dashboardDate, quickFlagged, soundEnabled, soundPack, totalTickets, dailyTarget]);

      const initiateBulkSaveCountdown = useCallback((type) => {
        if (bulkCountdown !== null) {
          clearInterval(bulkTimerRef.current);
          setBulkCountdown(null);
          handleBulkSaveAll(type);
          return;
        }
        
        playFeedbackTone('error', soundEnabled, soundPack);
        setToast({ message: 'SELECT BULK TYPE! Auto-saving in 3 seconds...', type: 'error' });
        
        let count = 3;
        setBulkCountdown(count);
        
        bulkTimerRef.current = setInterval(() => {
          count -= 1;
          if (count > 0) {
            setBulkCountdown(count);
          } else {
            clearInterval(bulkTimerRef.current);
            setBulkCountdown(null);
            handleBulkSaveAll(type);
          }
        }, 1000);
      }, [bulkCountdown, handleBulkSaveAll, soundEnabled, soundPack]);

      // --- Advanced Ninja Bulk Submit (From Secret Page) ---
      const handleSecretBulkSubmit = () => {
        const tokens = extractBulkTickets(secretBulkInput, prefixRules);
        if (tokens.length === 0) {
          setToast({ message: 'No valid tickets found to log.', type: 'error' });
          return;
        }

        let added = 0;
        const newEntries = [];
        const targetISO = dashboardDate || getTodayISO();

        tokens.forEach((tNo, idx) => {
          const cleaned = cleanTicketText(tNo, prefixRules);
          const normKey = cleaned.replace(/\s+/g, ' ').trim().toLowerCase();
          const exists = ticketIndex.byDateAndNo.has(`${targetISO}|${normKey}`);
          
          if (!exists) {
            added++;
            newEntries.push({
              id: Date.now() + idx + Math.random().toString(36).substr(2, 9),
              ticketNo: cleaned,
              type: secretBulkType,
              status: 'Completed',
              timeSpent: 5,
              description: secretBulkCustomNote || 'Ninja Bulk Log',
              timestamp: new Date().toLocaleString(),
              createdAtMs: Date.now() + idx,
              entryTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
              isoDate: targetISO,
              flagged: false
            });
          }
        });

        if (newEntries.length > 0) {
          setTickets(prev => [...newEntries, ...prev]);
        }

        setSecretBulkInput('');
        setSecretBulkCustomNote('');
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Ninja Logged ${added} tickets successfully! Skipped ${tokens.length - added} duplicates.`, type: 'success' });
      };

      // --- JSON Data Backup / Restore ---
      const handleExportJSON = () => {
        const data = {
          tickets,
          trashedTickets,
          taskTypes,
          prefixRules,
          secretNotes, 
          settings: { dailyTarget, weeklyTarget, monthlyTarget, theme, soundPack, compactView }
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `NasirTicketFlow_Backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setToast({ message: 'Backup successfully exported!', type: 'success' });
      };

      const handleImportJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.tickets && Array.isArray(data.tickets)) {
              setTickets(data.tickets);
              if (data.trashedTickets) setTrashedTickets(data.trashedTickets);
              if (data.taskTypes) setTaskTypes(data.taskTypes);
              if (data.prefixRules) setPrefixRules(data.prefixRules);
              if (data.secretNotes) {
                setSecretNotes(data.secretNotes);
                if (data.secretNotes.length > 0) setActiveNoteId(data.secretNotes[0].id);
              }
              if (data.settings) {
                if (data.settings.dailyTarget) setDailyTarget(data.settings.dailyTarget);
                if (data.settings.weeklyTarget) setWeeklyTarget(data.settings.weeklyTarget);
                if (data.settings.monthlyTarget) setMonthlyTarget(data.settings.monthlyTarget);
                if (data.settings.theme) setTheme(data.settings.theme);
              }
              playFeedbackTone('success', soundEnabled, soundPack);
              setToast({ message: 'Data restored successfully!', type: 'success' });
              setShowSecretPage(false);
            } else {
              setToast({ message: 'Invalid backup file format.', type: 'error' });
            }
          } catch (err) {
            setToast({ message: 'Error reading JSON file.', type: 'error' });
          }
        };
        reader.readAsText(file);
      };

      const handleUndoLastEntry = useCallback(() => {
        if (tickets.length === 0) return;
        const [latest, ...rest] = tickets;
        setTickets(rest);
        playFeedbackTone('error', soundEnabled, soundPack);
        setToast({ message: `Undid entry "${cleanTicketText(latest.ticketNo, prefixRules)}" (${latest.type})`, type: 'success' });
      }, [tickets, soundEnabled, soundPack, prefixRules]);

      const handleUndoLastDeletedBatch = useCallback(() => {
        if (!lastDeletedBatch || !lastDeletedBatch.tickets || lastDeletedBatch.tickets.length === 0) return false;
        if (Date.now() - lastDeletedBatch.deletedAt > 60000) {
          setLastDeletedBatch(null);
          return false;
        }
        const restoredItems = lastDeletedBatch.tickets.map(({ deletedAt, ...rest }) => rest);
        const restoredIdSet = new Set(restoredItems.map(item => item.id));
        setTickets(prev => [...restoredItems, ...prev]);
        setTrashedTickets(prev => prev.filter(item => !restoredIdSet.has(item.id)));
        setLastDeletedBatch(null);
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Undo successful! Restored ${restoredItems.length} deleted ticket(s).`, type: 'success' });
        return true;
      }, [lastDeletedBatch, soundEnabled, soundPack]);

      // Global Keyboard Shortcuts (Including Secret Keylogger, Search, and Popup Controls)
      useEffect(() => {
        const handleGlobalKeyDown = (e) => {
          const activeEl = document.activeElement;
          const isTypingField = activeEl && (activeEl.tagName === 'TEXTAREA' || (activeEl.tagName === 'INPUT' && activeEl.type !== 'checkbox' && activeEl.type !== 'radio'));

          // Secret Page Keylogger (listens outside inputs)
          if (!isTypingField) {
            keyBuffer.current = (keyBuffer.current + e.key.toLowerCase()).slice(-13);
            if (keyBuffer.current === 'tigerhunter43') {
              setShowSecretPage(true);
              keyBuffer.current = '';
            }
          }

          // Global Search Shortcut (Ctrl+K or /)
          if (((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') || (e.key === '/' && !isTypingField)) {
            if (!showQuickPopup && !duplicateConfirmData && !showTypeManager && !showSecretPage && !showRangePopup && !showBulkDeleteModal) {
              e.preventDefault();
              if (zenMode) setZenMode(false);
              setActiveTab('history');
              setTimeout(() => {
                searchInputRef.current?.focus();
                searchInputRef.current?.select();
              }, 70);
              return;
            }
          }

          // Global Undo (Ctrl+Z): Restores bulk deleted tickets within 1 minute, otherwise undoes last entry
          if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
            if (!isTypingField && !showQuickPopup && !duplicateConfirmData && !showTypeManager && !showSecretPage && !showRangePopup && !showBulkDeleteModal) {
              if (lastDeletedBatch && (Date.now() - lastDeletedBatch.deletedAt <= 60000)) {
                e.preventDefault();
                handleUndoLastDeletedBatch();
                return;
              }
              if (tickets.length > 0) {
                e.preventDefault();
                handleUndoLastEntry();
              }
              return;
            }
          }

          // ESC to close popups
          if (e.key === 'Escape') {
            if (showQuickPopup) { 
              setShowQuickPopup(false); 
              setBulkQueue([]); 
              if (bulkTimerRef.current) {
                clearInterval(bulkTimerRef.current);
                setBulkCountdown(null);
              }
            }
            else if (showBulkDeleteModal) { setShowBulkDeleteModal(false); setBulkDeleteStep1(false); }
            else if (duplicateConfirmData) { setDuplicateConfirmData(null); setTimeout(() => quickInputRef.current?.focus(), 50); }
            else if (showTypeManager) { setShowTypeManager(false); setEditingTypeIdx(null); }
            else if (showRangePopup) { setShowRangePopup(false); }
            else if (showSecretPage) { setShowSecretPage(false); }
            else if (zenMode) { setZenMode(false); }
            return;
          }

          // Keyboard handling for Quick Entry Popup
          if (showQuickPopup) {
            const isPopupNote = activeEl?.dataset?.popupNote === 'true';
            if (e.key === 'Enter') {
              e.preventDefault();
              if (bulkQueue.length > 1) {
                if (bulkCountdown !== null) {
                  clearInterval(bulkTimerRef.current);
                  setBulkCountdown(null);
                  handleBulkSaveAll(lastUsedType);
                } else {
                  initiateBulkSaveCountdown(lastUsedType);
                }
              }
              else handleQuickSave(lastUsedType);
            } else if (!isNaN(parseInt(e.key, 10)) && !isPopupNote) {
              const num = parseInt(e.key, 10);
              if (num >= 1 && num <= taskTypes.length) {
                e.preventDefault();
                if (bulkQueue.length > 1) handleBulkSaveAll(taskTypes[num - 1]);
                else handleQuickSave(taskTypes[num - 1]);
              }
            }
          }
          // Keyboard handling for Duplicate Confirmation Prompt
          else if (duplicateConfirmData) {
            if (e.key === 'Enter') {
              e.preventDefault();
              commitTicketEntry(duplicateConfirmData.ticketNo, duplicateConfirmData.selectedType, duplicateConfirmData.note || '', false, duplicateConfirmData.flagged);
            }
          }
        };
        window.addEventListener('keydown', handleGlobalKeyDown);
        return () => window.removeEventListener('keydown', handleGlobalKeyDown);
      }, [showQuickPopup, showBulkDeleteModal, duplicateConfirmData, showTypeManager, showRangePopup, showSecretPage, zenMode, taskTypes, lastUsedType, bulkQueue, tickets.length, lastDeletedBatch, handleUndoLastDeletedBatch, handleUndoLastEntry, handleQuickSave, handleBulkSaveAll, commitTicketEntry]);

      const processIncomingText = (rawText) => {
        const tokens = extractBulkTickets(rawText, prefixRules);
        if (tokens.length === 0) return;

        if (tokens.length > 1) {
          setBulkQueue(tokens);
          setQuickTicketNo(tokens[0]);
          setShowQuickPopup(true);
          setToast({ message: `Bulk Paste: ${tokens.length} tickets queued!`, type: 'success' });
          return;
        }

        setBulkQueue([]);
        initiateQuickPopup(tokens[0]);
      };

      const initiateQuickPopup = (rawValue) => {
        const check = validateTicketSubmission(rawValue);
        if (check.status === 'empty') return;

        if (check.status === 'same-day-duplicate') {
          playFeedbackTone('error', soundEnabled, soundPack);
          setToast({ message: `Entry Denied! "${check.normalized}" already exists on ${dashboardDate} (${check.existing.type}).`, type: 'error' });
          setQuickTicketNo('');
          setShowQuickPopup(false);
          setTimeout(() => {
            if (quickInputRef.current) quickInputRef.current.focus();
          }, 50);
          return;
        }

        if (check.status === 'other-day-duplicate') {
          // Instantly pop up the confirmation modal if it's an other-day duplicate
          setQuickTicketNo(check.normalized);
          setDuplicateConfirmData({
            ticketNo: check.normalized,
            previousDate: getTicketISO(check.existing),
            previousType: check.existing.type,
            selectedType: lastUsedType,
            note: '',
            flagged: false
          });
          return;
        }

        setQuickTicketNo(check.normalized);
        setShowQuickPopup(true);
      };

      const handleQuickPaste = (e) => {
        const pasted = e.clipboardData.getData('text');
        if (pasted) {
          e.preventDefault();
          processIncomingText(pasted);
        }
      };

      const handleOneClickClipboardPaste = async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            if (text && text.trim()) {
              processIncomingText(text);
            } else {
              playFeedbackTone('error', soundEnabled, soundPack);
              setToast({ message: 'Clipboard is empty!', type: 'error' });
            }
          } else {
            quickInputRef.current?.focus();
            setToast({ message: 'Press Ctrl+V to paste ticket.', type: 'error' });
          }
        } catch {
          quickInputRef.current?.focus();
          setToast({ message: 'Clipboard access blocked by browser — press Ctrl+V.', type: 'error' });
        }
      };
      
      const handleQuickKeyDown = (e) => {
        if (e.key === 'Enter' && cleanTicketText(quickTicketNo, prefixRules) && !showQuickPopup && !duplicateConfirmData) {
          e.preventDefault();
          processIncomingText(quickTicketNo);
        }
      };

      const toggleTicketFlag = (id) => {
        setTickets(prev => prev.map(t => t.id === id ? { ...t, flagged: !t.flagged } : t));
      };

      const handleCopyTicketId = (rawNo) => {
        const clean = cleanTicketText(rawNo, prefixRules);
        if (!clean) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(clean).then(() => {
            playFeedbackTone('success', soundEnabled, soundPack);
            setToast({ message: `Copied "${clean}" to clipboard!`, type: 'success' });
          }).catch(() => fallbackCopy(clean));
        } else {
          fallbackCopy(clean);
        }
      };

      const fallbackCopy = (text, customMsg) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          playFeedbackTone('success', soundEnabled, soundPack);
          setToast({ message: customMsg || `Copied "${text}" to clipboard!`, type: 'success' });
        } catch {
          setToast({ message: 'Failed to copy to clipboard.', type: 'error' });
        }
        document.body.removeChild(textarea);
      };

      const toggleSelectRow = (id) => setSelectedIds(prev => prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]);

      const toggleSelectAllFiltered = () => {
        const allFilteredIds = filteredTickets.map(t => t.id);
        const allSelected = allFilteredIds.length > 0 && allFilteredIds.every(id => selectedIds.includes(id));
        if (allSelected) {
          setSelectedIds(prev => prev.filter(id => !allFilteredIds.includes(id)));
        } else {
          setSelectedIds(prev => Array.from(new Set([...prev, ...allFilteredIds])));
        }
      };

      const handleBulkTypeChange = (newType) => {
        if (!newType || selectedIds.length === 0) return;
        const isAllSelected = filteredTickets.length > 1 && filteredTickets.every(t => selectedIds.includes(t.id));
        if (isAllSelected || selectedIds.length > 10) {
          playFeedbackTone('error', soundEnabled, soundPack);
          setToast({ message: 'Locked! Change Type only works for 1 to 10 tickets (not All Selected).', type: 'error' });
          setBulkActionType('');
          return;
        }
        setTickets(prev => prev.map(t => selectedIds.includes(t.id) ? { ...t, type: newType } : t));
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Updated ${selectedIds.length} tickets to ${newType}`, type: 'success' });
        setSelectedIds([]);
        setBulkActionType('');
      };

      const handleBulkDeleteRequest = () => {
        if (selectedIds.length === 0) return;
        if (selectedIds.length > 20) {
          playFeedbackTone('error', soundEnabled, soundPack);
          setToast({ message: 'Limit exceeded! You can delete maximum 20 tickets at once.', type: 'error' });
          return;
        }
        if (!bulkDeleteStep1) {
          setBulkDeleteStep1(true);
          setToast({ message: `Step 1/2: Click Confirm Delete again to proceed (${selectedIds.length} tickets).`, type: 'error' });
          return;
        }
        setShowBulkDeleteModal(true);
      };

      const handleConfirmBulkDelete = () => {
        if (selectedIds.length === 0 || selectedIds.length > 20) {
          setShowBulkDeleteModal(false);
          setBulkDeleteStep1(false);
          return;
        }
        const now = Date.now();
        const toTrash = tickets.filter(t => selectedIds.includes(t.id)).map(t => ({ ...t, deletedAt: now }));
        if (toTrash.length === 0) {
          setShowBulkDeleteModal(false);
          setBulkDeleteStep1(false);
          return;
        }
        setTrashedTickets(prev => [...toTrash, ...prev]);
        setTickets(prev => prev.filter(t => !selectedIds.includes(t.id)));
        setLastDeletedBatch({ tickets: toTrash, deletedAt: now });
        setSelectedIds([]);
        setBulkDeleteStep1(false);
        setShowBulkDeleteModal(false);
        playFeedbackTone('error', soundEnabled, soundPack);
        setToast({ message: `Moved ${toTrash.length} tickets to Trash. Press Ctrl+Z within 1 min to undo!`, type: 'success' });
      };

      const handleDeleteRequest = (id) => {
        if (confirmDeleteId === id) {
          const item = tickets.find(t => t.id === id);
          if (item) {
            const trashedItem = { ...item, deletedAt: Date.now() };
            setTrashedTickets(prev => [trashedItem, ...prev]);
            setLastDeletedBatch({ tickets: [trashedItem], deletedAt: trashedItem.deletedAt });
          }
          setTickets(prev => prev.filter(t => t.id !== id));
          setConfirmDeleteId(null);
          playFeedbackTone('error', soundEnabled, soundPack);
          setToast({ message: 'Moved ticket to Trash (Ctrl+Z within 1 min to undo).', type: 'success' });
        } else {
          setConfirmDeleteId(id);
          setToast({ message: 'Click Confirm within 3s to move to Trash!', type: 'error' });
        }
      };

      const handleRestoreTicket = (id) => {
        const item = trashedTickets.find(t => t.id === id);
        if (!item) return;
        const { deletedAt, ...restoredTicket } = item;
        setTickets(prev => [restoredTicket, ...prev]);
        setTrashedTickets(prev => prev.filter(t => t.id !== id));
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Restored "${cleanTicketText(item.ticketNo, prefixRules)}"!`, type: 'success' });
      };

      const handleRestoreAllTrash = () => {
        if (trashedTickets.length === 0) return;
        const restored = trashedTickets.map(({ deletedAt, ...rest }) => rest);
        setTickets(prev => [...restored, ...prev]);
        setTrashedTickets([]);
        setLastDeletedBatch(null);
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Restored all ${restored.length} tickets from Trash!`, type: 'success' });
      };

      const handlePermanentDelete = (id) => {
        setTrashedTickets(prev => prev.filter(t => t.id !== id));
        playFeedbackTone('error', soundEnabled, soundPack);
        setToast({ message: 'Permanently deleted ticket.', type: 'success' });
      };

      const handleEmptyTrash = () => {
        setTrashedTickets([]);
        playFeedbackTone('error', soundEnabled, soundPack);
        setToast({ message: 'Trash emptied completely.', type: 'success' });
      };

      const handleAddPrefixRule = (e) => {
        e.preventDefault();
        const trimmed = newPrefixRule.trim();
        if (!trimmed) return;
        if (prefixRules.some(r => r.toLowerCase() === trimmed.toLowerCase())) {
          setToast({ message: 'Prefix rule already exists!', type: 'error' });
          return;
        }
        setPrefixRules(prev => [...prev, trimmed]);
        setNewPrefixRule('');
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Added prefix cleaner "${trimmed}"`, type: 'success' });
      };

      const handleRemovePrefixRule = (idx) => setPrefixRules(prev => prev.filter((_, i) => i !== idx));

      const handleExportCSV = () => {
        if (tickets.length === 0) {
          setToast({ message: 'No tickets to export!', type: 'error' });
          return;
        }
        const headers = ['Ticket No', 'Task Type', 'Status', 'Time Spent (mins)', 'Description', 'Entry Time', 'Date/Time'];
        const csvContent = [
          headers.join(','),
          ...tickets.map(t => `"${cleanTicketText(t.ticketNo, prefixRules)}","${t.type}","${t.status}","${t.timeSpent || 0}","${(t.description || '').replace(/"/g, '""')}","${t.entryTime || ''}","${t.timestamp}"`)
        ].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `Work_Report_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setToast({ message: 'Report exported to CSV!', type: 'success' });
      };

      const handleCopyRangeSpreadsheet = () => {
        if (rangeTickets.length === 0) return;
        const groupedSections = rangeStatsByType.flatMap((stat) => {
          const groupTickets = rangeTickets.filter((t) => t.type === stat.name);
          return [
            '',
            `${stat.name.toUpperCase()} (${groupTickets.length})`,
            'SL\tTicket Number\tWork Type\tDate & Time',
            ...groupTickets.map((t, idx) => `${idx + 1}\t${cleanTicketText(t.ticketNo, prefixRules)}\t${t.type}\t${t.timestamp}`)
          ];
        });
        const summaryLines = [
          `WORK REPORT SUMMARY (${fromDate} to ${toDate || getTodayISO()})`,
          `Total Tickets:\t${rangeTickets.length}`,
          '',
          'COUNT BY WORK TYPE',
          'Work Type\tCount',
          ...rangeStatsByType.map(s => `${s.name}\t${s.count}`),
          ...groupedSections
        ];
        fallbackCopy(summaryLines.join('\n'), 'Copied in spreadsheet format!');
      };

      const handleDownloadRangeCSV = () => {
        if (rangeTickets.length === 0) return;
        const groupedCsvSections = rangeStatsByType.flatMap((stat) => {
          const groupTickets = rangeTickets.filter((t) => t.type === stat.name);
          return [
            '',
            `"${stat.name.toUpperCase()} (${groupTickets.length})"`,
            '"SL","Ticket Number","Work Type","Date & Time"',
            ...groupTickets.map((t, idx) => `"${idx + 1}","${cleanTicketText(t.ticketNo, prefixRules)}","${t.type}","${t.timestamp}"`)
          ];
        });
        const csvLines = [
          `"WORK REPORT SUMMARY (${fromDate} to ${toDate || getTodayISO()})"`,
          `"Total Tickets","${rangeTickets.length}"`,
          '',
          '"COUNT BY WORK TYPE"',
          '"Work Type","Count"',
          ...rangeStatsByType.map(s => `"${s.name}","${s.count}"`),
          ...groupedCsvSections
        ];
        const blob = new Blob([csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `Work_Summary_${fromDate}_to_${toDate || getTodayISO()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setToast({ message: 'Spreadsheet CSV downloaded!', type: 'success' });
      };

      const updateTicketStatus = (id, newStatus) => setTickets(prev => prev.map(t => t.id === id ? { ...t, status: newStatus } : t));
      
      const updateTicketType = (id, newType) => {
        setTickets(prev => prev.map(t => t.id === id ? { ...t, type: newType } : t));
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Updated work type to ${newType}`, type: 'success' });
      };

      const updateTicketNote = (id, newNote) => {
        setTickets(prev => prev.map(t => t.id === id ? { ...t, description: newNote.trim() || 'Fast Entry Log' } : t));
        setEditingNoteId(null);
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: 'Note updated!', type: 'success' });
      };

      const handleAddTaskType = (e) => {
        e.preventDefault();
        const trimmed = newTypeName.trim();
        if (!trimmed) return;
        if (taskTypes.some(t => t.toLowerCase() === trimmed.toLowerCase())) {
          playFeedbackTone('error', soundEnabled, soundPack);
          setToast({ message: `"${trimmed}" already exists!`, type: 'error' });
          return;
        }
        setTaskTypes(prev => [...prev, trimmed]);
        setNewTypeName('');
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Added "${trimmed}"`, type: 'success' });
      };

      const handleRenameTaskType = (idx) => {
        const oldName = taskTypes[idx];
        const trimmed = editingTypeVal.trim();
        if (!trimmed || trimmed === oldName) {
          setEditingTypeIdx(null);
          return;
        }
        if (taskTypes.some((t, i) => i !== idx && t.toLowerCase() === trimmed.toLowerCase())) {
          playFeedbackTone('error', soundEnabled, soundPack);
          setToast({ message: `"${trimmed}" already exists!`, type: 'error' });
          return;
        }
        setTaskTypes(prev => prev.map((t, i) => i === idx ? trimmed : t));
        setTickets(prev => prev.map(tk => tk.type === oldName ? { ...tk, type: trimmed } : tk));
        if (lastUsedType === oldName) setLastUsedType(trimmed);
        setEditingTypeIdx(null);
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Renamed "${oldName}" to "${trimmed}"`, type: 'success' });
      };

      const handleRemoveTaskType = (idx) => {
        if (taskTypes.length <= 1) {
          setToast({ message: 'At least 1 work type must remain.', type: 'error' });
          return;
        }
        const removed = taskTypes[idx];
        const nextTypes = taskTypes.filter((_, i) => i !== idx);
        setTaskTypes(nextTypes);
        if (lastUsedType === removed) setLastUsedType(nextTypes[0]);
        playFeedbackTone('success', soundEnabled, soundPack);
        setToast({ message: `Removed "${removed}"`, type: 'success' });
      };

      const handleDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
      const handleDrop = (e, targetStatus) => {
        e.preventDefault();
        if (draggedTicket && draggedTicket.status !== targetStatus) {
          updateTicketStatus(draggedTicket.id, targetStatus);
          setToast({ message: `Moved to ${targetStatus}`, type: 'success' });
        }
        setDraggedTicket(null);
      };
      const handleDragStart = (e, ticket) => {
        setDraggedTicket(ticket);
        e.dataTransfer.effectAllowed = 'move';
      };

      const filteredTickets = useMemo(() => {
        if (activeTab !== 'history') return [];
        const q = searchTerm.toLowerCase();
        return tickets.filter(t => {
          const cleanNo = cleanTicketText(t.ticketNo, prefixRules);
          const matchSearch = !q || cleanNo.toLowerCase().includes(q) || 
                              (t.description || '').toLowerCase().includes(q);
          const matchType = filterType === 'All' || t.type === filterType;
          const matchFlag = !onlyFlagged || Boolean(t.flagged);
          return matchSearch && matchType && matchFlag;
        });
      }, [activeTab, tickets, searchTerm, filterType, onlyFlagged, prefixRules]);

      const rangeTickets = useMemo(() => {
        if (activeTab !== 'history' && !showRangePopup) return [];
        return tickets.filter(t => {
          const iso = getTicketISO(t);
          if (fromDate && iso < fromDate) return false;
          if (toDate && iso > toDate) return false;
          return true;
        });
      }, [activeTab, showRangePopup, tickets, fromDate, toDate]);

      const rangeStatsByType = useMemo(() => {
        if (rangeTickets.length === 0) return [];
        const counts = {};
        taskTypes.forEach(type => { counts[type] = 0; });
        rangeTickets.forEach(t => { counts[t.type] = (counts[t.type] || 0) + 1; });
        return Object.keys(counts)
          .filter(k => counts[k] > 0)
          .map((key, idx) => ({ name: key, count: counts[key], color: COLORS[idx % COLORS.length] }));
      }, [rangeTickets, taskTypes]);

      const singleDateTickets = useMemo(() => {
        if (activeTab !== 'history' || !singleDate) return [];
        return tickets.filter(t => getTicketISO(t) === singleDate);
      }, [activeTab, tickets, singleDate]);

      const boardTicketsByStatus = useMemo(() => {
        const grouped = { 'Pending': [], 'In Progress': [], 'Completed': [], 'Cancelled': [] };
        if (activeTab !== 'board') return grouped;
        tickets.forEach(t => {
          if (grouped[t.status]) grouped[t.status].push(t);
        });
        return grouped;
      }, [activeTab, tickets]);

      const targetPercentage = Math.min(100, Math.round((totalTickets / Math.max(1, dailyTarget)) * 100));

      const goalProgress = useMemo(() => ({
        weekCount: aggregatedMetrics.weekCount,
        weekPct: Math.min(100, Math.round((aggregatedMetrics.weekCount / Math.max(1, weeklyTarget)) * 100)),
        monthCount: aggregatedMetrics.monthCount,
        monthPct: Math.min(100, Math.round((aggregatedMetrics.monthCount / Math.max(1, monthlyTarget)) * 100))
      }), [aggregatedMetrics.weekCount, aggregatedMetrics.monthCount, weeklyTarget, monthlyTarget]);

      const ticketsPerHour = useMemo(() => {
        if (dashboardTickets.length === 0) return '0.0';
        if (dashboardTickets.length === 1) return '1.0';
        const timestamps = dashboardTickets
          .map(t => t.createdAtMs || Number(String(t.id).split('-')[0]))
          .filter(n => !isNaN(n) && n > 0);
        if (timestamps.length < 2) return dashboardTickets.length.toFixed(1);
        const minMs = Math.min(...timestamps);
        const maxMs = Math.max(...timestamps);
        const elapsedHours = Math.max((maxMs - minMs) / (1000 * 60 * 60), 0.25);
        return (dashboardTickets.length / elapsedHours).toFixed(1);
      }, [dashboardTickets]);

      const predictiveInsight = useMemo(() => {
        const remaining = dailyTarget - totalTickets;
        if (remaining <= 0) return { text: 'Daily target achieved! Great momentum.', done: true };
        const rate = parseFloat(ticketsPerHour);
        if (!rate || rate <= 0 || totalTickets < 2) return { text: 'Log 2+ tickets to unlock AI ETA forecast', done: false };
        const hoursNeeded = remaining / rate;
        if (hoursNeeded > 16) return { text: `Need ~${hoursNeeded.toFixed(1)} hrs at current pace`, done: false };
        const eta = new Date(Date.now() + hoursNeeded * 3600 * 1000);
        const etaStr = eta.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return { text: `AI Forecast: Target hits around ${etaStr}`, done: false };
      }, [dailyTarget, totalTickets, ticketsPerHour]);

      const streakAndBest = useMemo(() => {
        let bestDayCount = 0;
        let bestDayDate = '';
        Object.entries(countsByDay).forEach(([day, cnt]) => {
          if (cnt > bestDayCount) { bestDayCount = cnt; bestDayDate = day; }
        });

        let streak = 0;
        const cursor = new Date();
        const formatLocal = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

        const todayStr = formatLocal(cursor);
        if ((countsByDay[todayStr] || 0) < dailyTarget) cursor.setDate(cursor.getDate() - 1);

        while (true) {
          const key = formatLocal(cursor);
          if ((countsByDay[key] || 0) >= dailyTarget) {
            streak++;
            cursor.setDate(cursor.getDate() - 1);
          } else break;
        }
        return { streak, bestDayCount, bestDayDate };
      }, [countsByDay, dailyTarget]);

      const unlockedBadges = useMemo(() => {
        const badges = [];
        const speed = parseFloat(ticketsPerHour);
        if (speed >= 50 || streakAndBest.bestDayCount >= 100) {
          badges.push({ id: 'speed-demon', label: 'Speed Demon', desc: '50+ tickets/hr pace or 100+ in a day', color: 'bg-purple-100 text-purple-700 border-purple-300 dark:bg-purple-900/50 dark:text-purple-300 dark:border-purple-600', icon: 'Zap' });
        }
        if (streakAndBest.streak >= 7) {
          badges.push({ id: 'marathoner', label: 'Marathoner', desc: '7+ day target streak', color: 'bg-orange-100 text-orange-700 border-orange-300 dark:bg-orange-900/50 dark:text-orange-300 dark:border-orange-600', icon: 'Flame' });
        } else if (streakAndBest.streak >= 3) {
          badges.push({ id: 'consistent', label: 'On Fire', desc: '3+ day target streak', color: 'bg-amber-100 text-amber-700 border-amber-300 dark:bg-amber-900/50 dark:text-amber-300 dark:border-amber-600', icon: 'Flame' });
        }
        if (totalTickets >= dailyTarget && dailyTarget > 0) {
          badges.push({ id: 'goal-crusher', label: 'Goal Crusher', desc: 'Hit 100% of daily target', color: 'bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/50 dark:text-emerald-300 dark:border-emerald-600', icon: 'Target' });
        }
        if (tickets.length >= 500) {
          badges.push({ id: 'veteran', label: '500 Club', desc: '500+ total tickets logged', color: 'bg-blue-100 text-blue-700 border-blue-300 dark:bg-blue-900/50 dark:text-blue-300 dark:border-blue-600', icon: 'Award' });
        } else if (tickets.length >= 100) {
          badges.push({ id: 'centurion', label: 'Centurion', desc: '100+ total tickets logged', color: 'bg-sky-100 text-sky-700 border-sky-300 dark:bg-sky-900/50 dark:text-sky-300 dark:border-sky-600', icon: 'Award' });
        }
        return badges;
      }, [ticketsPerHour, streakAndBest, totalTickets, dailyTarget, tickets.length]);

      const activityHeatmapWeeks = useMemo(() => {
        const weeks = [];
        const today = new Date();
        const start = new Date(today);
        start.setDate(today.getDate() - (23 * 7) - today.getDay());

        let cursor = new Date(start);
        for (let w = 0; w < 24; w++) {
          const days = [];
          for (let d = 0; d < 7; d++) {
            const iso = `${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, '0')}-${String(cursor.getDate()).padStart(2, '0')}`;
            const count = countsByDay[iso] || 0;
            const isFuture = cursor > today;
            days.push({ iso, count, isFuture });
            cursor.setDate(cursor.getDate() + 1);
          }
          weeks.push(days);
        }
        return weeks;
      }, [countsByDay]);

      const hourlyProductivity = useMemo(() => {
        const buckets = {};
        dashboardTickets.forEach(t => {
          let hr = typeof t.entryHour === 'number' ? t.entryHour : null;
          if (hr === null && t.createdAtMs) {
            hr = new Date(t.createdAtMs).getHours();
          } else if (hr === null && t.entryTime) {
            const match = t.entryTime.match(/(\d+):\d+:\d+\s*(AM|PM)?/i);
            if (match) {
              let h = parseInt(match[1], 10);
              const mer = (match[2] || '').toUpperCase();
              if (mer === 'PM' && h < 12) h += 12;
              if (mer === 'AM' && h === 12) h = 0;
              hr = h;
            }
          }
          if (hr !== null && !isNaN(hr)) buckets[hr] = (buckets[hr] || 0) + 1;
        });

        const hours = Object.keys(buckets).map(Number).sort((a, b) => a - b);
        if (hours.length === 0) return [];
        const minH = Math.min(...hours);
        const maxH = Math.max(...hours);
        const result = [];
        for (let h = minH; h <= maxH; h++) {
          const label = h === 0 ? '12 AM' : h < 12 ? `${h} AM` : h === 12 ? '12 PM' : `${h - 12} PM`;
          result.push({ hour: label, count: buckets[h] || 0 });
        }
        return result;
      }, [dashboardTickets]);

      const liveLookupStatus = useMemo(() => {
        const cleaned = cleanTicketText(quickTicketNo, prefixRules).replace(/\s+/g, ' ').trim();
        if (!cleaned || cleaned.includes(' ')) return null;
        const normKey = cleaned.toLowerCase();
        const targetISO = dashboardDate || getTodayISO();
        const sameDay = ticketIndex.byDateAndNo.get(`${targetISO}|${normKey}`);
        if (sameDay) return { state: 'same-day', ticket: cleaned, type: sameDay.type, date: targetISO };
        const otherDay = ticketIndex.byLowerNo.get(normKey);
        if (otherDay) return { state: 'other-day', ticket: cleaned, type: otherDay.type, date: getTicketISO(otherDay) };
        return { state: 'new', ticket: cleaned };
      }, [quickTicketNo, ticketIndex, prefixRules, dashboardDate]);

      // --- Render Helpers ---
      const renderPasteCard = (isZen = false) => html`
        <div 
          onClick=${() => quickInputRef.current?.focus()}
          className=${`w-full ${isZen ? 'max-w-xl min-h-[380px] p-8 sm:p-10 shadow-2xl' : 'h-full min-h-[320px] p-6 sm:p-7 shadow-lg shadow-blue-500/10 dark:shadow-blue-950/40'} bg-gradient-to-br from-white via-blue-50/60 to-indigo-100/60 dark:from-slate-800 dark:via-blue-950/40 dark:to-indigo-950/50 rounded-3xl border-2 border-blue-200/80 dark:border-blue-500/30 flex flex-col items-center justify-center text-center cursor-text hover:border-blue-500 dark:hover:border-blue-400 transition-all relative overflow-hidden`}
        >
          <div className="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500" />

          <button
            type="button"
            onClick=${(e) => { e.stopPropagation(); setZenMode(!zenMode); }}
            className=${`absolute top-4 left-4 inline-flex items-center gap-1 px-2.5 py-1 rounded-xl text-[11px] font-semibold transition-colors ${
              isZen
                ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-sm'
                : 'bg-white/80 hover:bg-blue-600 text-slate-700 hover:text-white dark:bg-slate-800/90 dark:hover:bg-blue-600 dark:text-slate-200 border border-blue-200/70 dark:border-slate-600 shadow-xs'
            }`}
            title=${isZen ? 'Exit Zen Mode (ESC)' : 'Enter distraction-free Zen Mode'}
          >
            <${Icon} name=${isZen ? 'Minimize2' : 'Maximize2'} className="w-3.5 h-3.5" />
            <span>${isZen ? 'Exit Zen' : 'Zen Mode'}</span>
          </button>

          ${tickets.length > 0 && html`
            <button
              type="button"
              onClick=${(e) => { e.stopPropagation(); handleUndoLastEntry(); }}
              className=${`absolute top-4 right-4 inline-flex items-center gap-1 px-2.5 py-1 rounded-xl text-[11px] font-semibold bg-white/80 hover:bg-rose-500 text-slate-700 hover:text-white dark:bg-slate-800/90 dark:hover:bg-rose-600 dark:text-slate-200 border border-rose-200/70 dark:border-slate-600 shadow-xs transition-all duration-1000 ${showUndoBtn ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-2 pointer-events-none'}`}
              title=${`Undo last ticket (Ctrl+Z): ${cleanTicketText(tickets[0].ticketNo, prefixRules)}`}
            >
              <${Icon} name="Undo2" className="w-3.5 h-3.5" />
              <span>Undo (Ctrl+Z)</span>
            </button>
          `}

          ${isZen && html`
            <div className="mb-3 flex items-center gap-3 text-xs font-bold text-slate-600 dark:text-slate-300">
              <span>Today: <strong className="text-blue-600 dark:text-blue-400">${totalTickets}/${dailyTarget}</strong></span>
              <span>•</span>
              <span>Speed: <strong className="text-emerald-600 dark:text-emerald-400">${ticketsPerHour}/hr</strong></span>
            </div>
          `}

          <h2 className="text-xl sm:text-2xl font-extrabold bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-700 dark:from-blue-300 dark:via-indigo-300 dark:to-purple-300 bg-clip-text text-transparent mb-5">
            Paste Ticket to Log
          </h2>
          
          <div className="w-full flex flex-col gap-3">
            <input
              ref=${quickInputRef}
              type="text"
              autoFocus
              value=${quickTicketNo}
              onChange=${(e) => setQuickTicketNo(cleanTicketText(e.target.value, prefixRules))}
              onPaste=${handleQuickPaste}
              onKeyDown=${handleQuickKeyDown}
              placeholder="Paste single or bulk tickets..."
              className="neon-glow w-full text-center text-base font-semibold px-4 py-4 rounded-2xl border-2 bg-white/95 dark:bg-slate-900/90 text-slate-800 dark:text-white outline-none transition-all duration-300 placeholder:text-slate-400"
            />
            ${liveLookupStatus && html`
              <div className="flex justify-center">
                ${liveLookupStatus.state === 'new' && html`
                  <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-semibold bg-emerald-100/90 dark:bg-emerald-900/50 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-700">
                    <${Icon} name="CheckCircle" className="w-3 h-3" />
                    New Ticket — Ready to Log
                  </span>
                `}
                ${liveLookupStatus.state === 'same-day' && html`
                  <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-semibold bg-rose-100/90 dark:bg-rose-900/50 text-rose-800 dark:text-rose-300 border border-rose-300 dark:border-rose-700">
                    <${Icon} name="AlertCircle" className="w-3 h-3" />
                    Already logged today (${liveLookupStatus.type})
                  </span>
                `}
                ${liveLookupStatus.state === 'other-day' && html`
                  <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-semibold bg-amber-100/90 dark:bg-amber-900/50 text-amber-800 dark:text-amber-300 border border-amber-300 dark:border-amber-700">
                    <${Icon} name="Clock" className="w-3 h-3" />
                    Logged on ${liveLookupStatus.date} (${liveLookupStatus.type})
                  </span>
                `}
              </div>
            `}
            <div className="grid grid-cols-2 gap-2.5">
              <button
                type="button"
                onClick=${(e) => { e.stopPropagation(); handleOneClickClipboardPaste(); }}
                className="py-3 px-3 bg-white hover:bg-blue-50 dark:bg-slate-800 dark:hover:bg-slate-700 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-700/60 text-xs sm:text-sm font-bold rounded-2xl transition-all flex items-center justify-center gap-1.5 shadow-xs"
              >
                <${Icon} name="ClipboardPaste" className="w-4 h-4 text-blue-600 dark:text-blue-400" />
                <span>Paste & Log</span>
              </button>
              <button
                type="button"

                    type="button"
                    onClick=${() => { setShowBulkDeleteModal(false); setBulkDeleteStep1(false); }}
                    className="flex-1 py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-300 font-semibold text-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick=${handleConfirmBulkDelete}
                    className="flex-1 py-2.5 px-4 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-sm shadow-sm transition-colors"
                  >
                    Yes, Move to Trash
                  </button>
                </div>
              </div>
            </div>
          `}

          ${toast && html`
            <${Toast} 
              message=${toast.message} 
              type=${toast.type} 
              onClose=${() => setToast(null)} 
            />
          `}
        </div>
      `;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(html`<${App} />`);
  </script>
</body>
</html>
